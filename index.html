<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitaciones ETINAR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23423D3B'/><rect x='26' y='30' width='20' height='20' rx='3' fill='%23F2B200'/><path d='M56 34h10v10h-10z M56 46h10v10h-10z' fill='%23ffffff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#2C2A28; --charcoal:#423D3B; --muted:#8C857E; --muted2:#6B655F;
  --line:#E6E2DD; --line-soft:#EDE9E4;
  --gold:#F2B200; --gold-deep:#B8791A; --gold-soft:#FBF6E8;
  --paper:#FAF9F7; --paper2:#F4F2EE; --card:#FFFFFF;
  --green:#2E7D52; --green-soft:#E7F3EC;
  --red:#C0392B; --red-soft:#FBEBE9;
  --blue:#2F6FB0; --blue-soft:#E8F0F8;
  --purple:#7A5AB0; --purple-soft:#F0EAF7;
  --sidebar:#37332F;
  --shadow:0 1px 2px rgba(44,42,40,.05),0 8px 24px rgba(44,42,40,.06);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0;color:var(--charcoal);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.logo{display:flex;align-items:center;gap:11px}
.logo .mark{width:34px;height:34px;background:var(--gold);border-radius:6px;position:relative;flex:none}
.logo .mark::after{content:"";position:absolute;right:5px;top:5px;width:9px;height:9px;background:#fff;box-shadow:0 12px 0 #fff}
.logo .word{font-family:'Hanken Grotesk',sans-serif;font-weight:700;letter-spacing:.14em;font-size:19px}
.logo .r{font-size:9px;vertical-align:super;opacity:.7;margin-left:1px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,#4a443f 0,var(--charcoal) 55%,#2b2724 100%)}
.login-card{background:var(--card);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;max-width:410px;padding:38px 34px;text-align:center}
.login-card .logo{justify-content:center;margin-bottom:6px}
.login-card .logo .word{color:var(--charcoal)}
.login-sub{color:var(--muted);font-size:14px;margin:2px 0 26px}
.login-card h1{font-size:26px;margin-bottom:4px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted2);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--paper);transition:border-color .15s}
.field input:focus{border-color:var(--gold);outline:none;background:#fff}
.btn-primary{background:var(--charcoal);color:#fff;border:none;padding:13px 18px;border-radius:11px;font-weight:600;font-size:15px;width:100%;transition:transform .08s,background .15s}
.btn-primary:hover{background:#2b2724}.btn-primary:active{transform:scale(.99)}
.login-demo{margin-top:18px;font-size:13px;color:var(--muted)}.login-demo b{color:var(--gold-deep)}
.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:274px minmax(0,1fr)}
.sidebar{background:var(--sidebar);color:#e9e5e0;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow-y:auto}
.sidebar .brand{padding:20px 20px 14px}
.sidebar .brand .word{color:#fff}
.sidebar .brand .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:9px;font-weight:600}
.nav-group{padding:4px 12px}
.nav-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#9a938c;padding:15px 10px 7px;font-weight:700;display:flex;align-items:center;gap:7px}
.nav-label .ic{width:14px;height:14px;opacity:.8}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cfc9c2;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .13s,color .13s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--gold);color:#3a3430;font-weight:600}
.nav-item .ic{width:18px;height:18px;flex:none;opacity:.85}.nav-item.active .ic{opacity:1}
.side-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;color:#cfc9c2;cursor:pointer;font-size:13.5px;transition:background .13s,color .13s;border:none;background:none;width:100%;text-align:left}
.side-item:hover{background:rgba(255,255,255,.06);color:#fff}
.side-item.active{background:rgba(242,178,0,.16);color:#fff}
.side-dot{width:9px;height:9px;border-radius:50%;flex:none}
.side-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .count{font-size:11px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:20px;color:#e9e5e0;flex:none}
.sidebar-foot{margin-top:auto;padding:15px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#9a938c}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 30px;border-bottom:1px solid var(--line);background:rgba(250,249,247,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.topbar h1{font-size:22px}
.topbar .crumb{font-size:12.5px;color:var(--muted)}
.topbar-spacer{flex:1}
.save-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted2);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);padding:5px 12px 5px 5px;border-radius:20px;font-size:13.5px;font-weight:600;color:var(--charcoal)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--charcoal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px;line-height:0}
.content{padding:26px 30px 60px;max-width:1240px;width:100%;margin:0 auto;flex:1;min-width:0}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:15px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px 17px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-label{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:'Fraunces',serif;font-size:33px;font-weight:500;color:var(--charcoal);margin-top:5px;line-height:1}
.kpi .k-val small{font-size:15px;color:var(--muted)}
.kpi .k-sub{font-size:11.5px;color:var(--muted2);margin-top:6px}
.kpi .k-ic{position:absolute;top:15px;right:15px;width:33px;height:33px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .k-ic svg{width:17px;height:17px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.panel-h h2{font-size:19px}.panel-h .sub{font-size:12.5px;color:var(--muted)}.panel-h .r{margin-left:auto}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
.chart-box{position:relative;height:280px}.chart-box.sm{height:230px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px}
.chip.plan{background:var(--blue-soft);color:var(--blue)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.late{background:var(--red-soft);color:var(--red)}
.chip.soon{background:var(--gold-soft);color:var(--gold-deep)}
.chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px}
.tag svg{width:12px;height:12px}
.tag.oblig{background:var(--red-soft);color:var(--red)}
.tag.plani{background:var(--blue-soft);color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--charcoal);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;transition:background .13s,border-color .13s,transform .08s}
.btn:hover{background:var(--paper2);border-color:#d8d2ca}.btn:active{transform:scale(.98)}
.btn.dark{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}.btn.dark:hover{background:#2b2724}
.btn.gold{background:var(--gold);color:#3a3430;border-color:var(--gold)}.btn.gold:hover{filter:brightness(.97)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--paper2)}
.btn .ic{width:16px;height:16px}
.scope-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
.scope-badge{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:24px;flex:none}
.scope-badge svg{width:26px;height:26px}
.scope-head .meta h1{font-size:25px;line-height:1.15}
.scope-head .meta p{color:var(--muted);font-size:13.5px;margin:5px 0 0}
.ring-wrap{margin-left:auto;text-align:center;flex:none}
.ring{position:relative;width:88px;height:88px}
.ring svg{transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-txt b{font-family:'Fraunces',serif;font-size:22px;color:var(--charcoal);line-height:1}
.ring .ring-txt span{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.cap-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;transition:border-color .13s,box-shadow .13s}
.cap-card:hover{border-color:#d8d2ca}
.cap-card.open{box-shadow:0 2px 4px rgba(44,42,40,.05),0 14px 34px rgba(44,42,40,.09)}
.cap-top{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer}
.cap-top .accent{width:4px;align-self:stretch;border-radius:4px;flex:none;min-height:34px}
.cap-head{min-width:0;flex:1}
.cap-title{font-family:'Fraunces',serif;font-size:16px;color:var(--charcoal);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-mini{display:flex;flex-wrap:wrap;gap:12px;margin-top:3px;font-size:12px;color:var(--muted)}
.cap-mini span{display:inline-flex;align-items:center;gap:4px}
.cap-mini .ic{width:13px;height:13px;opacity:.7}
.cap-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .18s}
.cap-card.open .chev{transform:rotate(180deg)}
.cap-body{display:none;padding:2px 18px 20px;border-top:1px solid var(--line-soft)}
.cap-card.open .cap-body{display:block}
.tipo-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0 8px}
.tipo-seg button{border:none;background:#fff;padding:9px 14px;font-size:12.5px;color:var(--muted2);font-weight:600;display:flex;align-items:center;gap:6px}
.tipo-seg button svg{width:13px;height:13px}
.tipo-seg button.on-o{background:var(--red-soft);color:var(--red)}
.tipo-seg button.on-p{background:var(--blue-soft);color:var(--blue)}
.cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:13px;margin:14px 0}
.info-cell{background:var(--paper);border:1px solid var(--line-soft);border-radius:11px;padding:10px 13px}
.info-cell .il{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.info-cell .il svg{width:12px;height:12px}
.info-cell .iv{font-size:14px;color:var(--charcoal);margin-top:4px;font-weight:500}
.legal-box{background:var(--gold-soft);border:1px solid #efe2c4;border-left:3px solid var(--gold);border-radius:11px;padding:12px 15px;margin:4px 0}
.legal-box .lh{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;display:flex;align-items:center;gap:6px}
.legal-box .lh svg{width:13px;height:13px}
.legal-box p{margin:6px 0 0;font-size:13.5px;color:#5b4a2a;line-height:1.55}
.legal-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:7px}
.sec-title{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:7px}
.sec-title svg{width:14px;height:14px}
.file-grid{display:flex;flex-wrap:wrap;gap:9px}
.file-item{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--charcoal);max-width:250px}
.file-item .thumb{width:32px;height:32px;border-radius:7px;object-fit:cover;flex:none;border:1px solid var(--line)}
.file-item .fic{width:30px;height:30px;border-radius:7px;background:var(--paper2);display:flex;align-items:center;justify-content:center;flex:none}
.file-item .fic svg{width:15px;height:15px;color:var(--muted2)}
.file-item .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .go{color:var(--blue);font-size:12px;font-weight:600;flex:none}
.file-item .rm{margin-left:2px;color:var(--muted);background:none;border:none;padding:2px;line-height:0}
.file-item .rm svg{width:14px;height:14px}
.file-empty{font-size:13px;color:var(--muted);font-style:italic}
.att-summary{display:flex;gap:9px;flex-wrap:wrap;margin:2px 0 4px}
.att-panel{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--paper)}
.att-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.att-search{flex:1;min-width:150px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:7px 12px;font-size:12px;color:var(--muted2);font-weight:600}
.seg button.on{background:var(--charcoal);color:#fff}
.att-list{max-height:300px;overflow-y:auto}
.att-item{display:flex;align-items:center;gap:11px;padding:8px 3px;border-bottom:1px solid var(--line-soft)}
.att-item:last-child{border-bottom:none}
.att-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex:none;cursor:pointer}
.att-sex{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.sex-m{background:var(--blue)}.sex-f{background:var(--purple)}
.att-item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-item .cd{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
.att-item .cg{margin-left:auto;color:var(--muted);font-size:12px;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-item.ext{background:var(--gold-soft);border-radius:8px}
.cal-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-title{font-family:'Fraunces',serif;font-size:22px;color:var(--charcoal);min-width:190px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--charcoal)}
.icon-btn:hover{background:var(--paper2)}.icon-btn svg{width:18px;height:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;width:100%}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 0}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:11px;min-height:100px;padding:7px;min-width:0;overflow:hidden}
.cal-cell.other{background:var(--paper2);opacity:.5}
.cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,178,0,.18)}
.cal-day{font-size:13px;font-weight:600;color:var(--muted2);margin-bottom:5px}
.cal-cell.today .cal-day{color:var(--gold-deep)}
.cal-ev{display:block;width:100%;text-align:left;border:none;border-radius:7px;padding:5px 7px;margin-bottom:4px;font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev.plan{background:var(--blue-soft);color:var(--blue)}.cal-ev.ok{background:var(--green-soft);color:var(--green)}
.cal-ev.late{background:var(--red-soft);color:var(--red)}.cal-ev.soon{background:var(--gold-soft);color:var(--gold-deep)}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:11px;height:11px;border-radius:3px}
@media(max-width:720px){.cal-cell{min-height:64px}.cal-ev{font-size:0;padding:4px;margin-bottom:3px}.cal-ev::before{content:"\25CF";font-size:10px}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-soft);color:var(--charcoal)}
.tbl tr:last-child td{border-bottom:none}
.tbl .mono{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--muted2)}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:none}
.list-row .nm{font-weight:600;color:var(--charcoal)}
.list-row .rr{margin-left:auto;display:flex;gap:6px;align-items:center}
.tinybtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted2)}
.tinybtn:hover{background:var(--paper2);color:var(--charcoal)}
.scroll-list{max-height:320px;overflow-y:auto}
.note-box{font-size:12.5px;color:var(--muted2);background:var(--gold-soft);border:1px solid #efe2c4;border-radius:10px;padding:11px 13px;display:flex;gap:9px;align-items:flex-start}
.note-box svg{width:15px;height:15px;color:var(--gold-deep);flex:none;margin-top:1px}
.modal-bg{position:fixed;inset:0;background:rgba(44,42,40,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:560px;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:12px;padding:19px 24px;border-bottom:1px solid var(--line)}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function estadoReal(c){
  if(c.estado==='ejecutada')return 'ok';
  var f=new Date(c.fecha+'T00:00:00');
  if(f<HOY)return 'late';
  if((f-HOY)/86400000<=21)return 'soon';
  return 'plan';
}
const ESTADO_TXT={ok:'Ejecutada',late:'Vencida',soon:'Proxima',plan:'Planificada'};
function chip(e){return '<span class="chip '+e+'"><span class="chip-dot"></span>'+ESTADO_TXT[e]+'</span>';}

function qrPeople(capId){var seen={},out=[];EVALS.forEach(function(e){if(e.cap_id!==capId)return;var ced=(e.cedula||'').trim();var n=qrNombre(e);var key=ced||n.toLowerCase();if(!key)return;if(seen[key])return;seen[key]=1;out.push({ced:ced,nombre:n||ced,rating:e.rating});});return out;}
function attData(c){
  var rosterC=rosterObra(c.obId);
  var rosterCed={};rosterC.forEach(function(e){rosterCed[e.ced]=e;});
  var qr=qrPeople(c.id);
  var qrMatched={},qrExt=[];
  qr.forEach(function(p){if(p.ced&&rosterCed[p.ced])qrMatched[p.ced]=1;else qrExt.push(p);});
  var attendedCed={};(c.asistieron||[]).forEach(function(x){attendedCed[x]=1;});Object.keys(qrMatched).forEach(function(x){attendedCed[x]=1;});
  var asistieron=rosterC.filter(function(e){return attendedCed[e.ced];});
  var faltan=rosterC.filter(function(e){return !attendedCed[e.ced];});
  var extra=c.extra||[];
  var h=0,f=0;asistieron.concat(extra).forEach(function(e){if(e.sexo==='F')f++;else h++;});
  var nominal=asistieron.length+extra.length+qrExt.length;
  if(nominal===0&&((c.nReal||0)>0||c.imp)){
    var nA=c.nReal||0, proj=c.nProj||0;
    var cobI=proj?Math.min(100,Math.round(nA/proj*100)):(nA?100:0);
    return {rosterC:rosterC,asistieron:[],faltan:faltan,extra:[],qr:[],qrExt:[],nAsist:nA,cob:cobI,h:0,f:0,imp:!!c.imp,manual:true,proj:proj};
  }
  var cob=rosterC.length?Math.min(100,Math.round(nominal/rosterC.length*100)):(nominal?100:0);
  return {rosterC:rosterC,asistieron:asistieron,faltan:faltan,extra:extra,qr:qr,qrExt:qrExt,nAsist:nominal,cob:cob,h:h,f:f,imp:!!c.imp,manual:false,proj:(c.nProj||0)};
}
function kpisScope(caps){
  var total=caps.length, ejec=caps.filter(function(c){return c.estado==='ejecutada';}).length;
  var venc=caps.filter(function(c){return estadoReal(c)==='late';}).length;
  var h=0,f=0,horas=0,pers=0;
  caps.filter(function(c){return c.estado==='ejecutada';}).forEach(function(c){var a=attData(c);h+=a.h;f+=a.f;pers+=a.nAsist;horas+=c.dur*a.nAsist;});
  return {total:total,ejec:ejec,pct:total?Math.round(ejec/total*100):0,venc:venc,h:h,f:f,pers:pers,horasHombre:Math.round(horas/60)};
}

function attRows(c){
  var ui=attUI[c.id], a=attData(c);
  var set={};(c.asistieron||[]).forEach(function(x){set[x]=1;});
  var q=ui.q.toLowerCase().trim();
  var rows='';
  if(ui.filter!=='no'){
    (c.extra||[]).forEach(function(e,i){
      if(q&&!(e.nombre.toLowerCase().indexOf(q)>=0||(e.cedula||'').indexOf(q)>=0))return;
      rows+='<div class="att-item ext"><input type="checkbox" checked disabled>'+
        '<span class="att-sex '+(e.sexo==='F'?'sex-f':'sex-m')+'">'+e.sexo+'</span>'+
        '<span class="nm">'+esc(e.nombre)+' <span style="color:var(--gold-deep);font-size:11px">\u00b7 externo</span></span>'+
        '<span class="cd">'+esc(e.cedula||'\u2014')+'</span>'+
        '<button class="rm" data-rm-ext="'+c.id+'|'+i+'" title="Quitar">'+svg('trash')+'</button></div>';
    });
  }
  var list=a.rosterC;
  if(ui.filter==='si')list=a.rosterC.filter(function(e){return set[e.ced];});
  else if(ui.filter==='no')list=a.rosterC.filter(function(e){return !set[e.ced];});
  if(q)list=list.filter(function(e){return e.nom.toLowerCase().indexOf(q)>=0||e.ced.indexOf(q)>=0;});
  if(!list.length&&!rows)return '<div class="file-empty" style="padding:12px">Sin empleados que coincidan.</div>';
  rows+=list.slice(0,500).map(function(e){var on=set[e.ced];
    return '<div class="att-item"><input type="checkbox" '+(on?'checked':'')+' data-att-check="'+c.id+'|'+e.ced+'">'+
      '<span class="att-sex '+(e.sexo==='F'?'sex-f':'sex-m')+'">'+e.sexo+'</span>'+
      '<span class="nm">'+esc(e.nom)+'</span><span class="cd">'+e.ced+'</span><span class="cg">'+esc(e.cargo)+'</span></div>';
  }).join('');
  if(list.length>500)rows+='<div class="file-empty" style="padding:10px">Mostrando 500 de '+list.length+'. Usa el buscador para afinar.</div>';
  return rows;
}

function drawCalendar(){
  var y=state.calY,m=state.calM;
  var meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calTitle').textContent=meses[m]+' '+y;
  var first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var dow=['Lun','Mar','Mi\u00e9','Jue','Vie','S\u00e1b','Dom'];
  var cells=dow.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
  for(var i=0;i<start;i++)cells+='<div class="cal-cell other"></div>';
  for(var day=1;day<=days;day++){
    var dstr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isT=(iso(HOY)===dstr);
    var evs=CAPS.filter(function(c){return c.fecha===dstr&&(!state.calObId||c.obId===state.calObId);});
    var evHTML=evs.map(function(c){var e=estadoReal(c);return '<button class="cal-ev '+e+'" data-open-obra="'+c.obId+'" data-cap="'+c.id+'" title="'+esc(c.nombre)+'">'+esc(c.nombre)+'</button>';}).join('');
    cells+='<div class="cal-cell'+(isT?' today':'')+'"><div class="cal-day">'+day+'</div>'+evHTML+'</div>';
  }
  document.getElementById('calGrid').innerHTML=cells;
}

var indState=null;
var IND_COLORS=['#B8791A','#2F6FB0','#2E7D52','#7A5AB0','#C0392B','#D9A441','#5A9E8C','#8A6E6E','#4A7BA6','#B0803A','#C98A2B','#6E8FB0'];
function indDate(c){return c.fechaEjec||c.fecha||'';}
function ymOf(dstr){return (dstr||'').slice(0,7);}
function indDefault(){var min=null,max=null;CAPS.forEach(function(c){var dt=indDate(c);if(!dt)return;if(!min||dt<min)min=dt;if(!max||dt>max)max=dt;});
  if(!min){var t=iso(HOY);min=t;max=t;}
  return {fromY:+min.slice(0,4),fromM:+min.slice(5,7),toY:+max.slice(0,4),toM:+max.slice(5,7),obras:{}};}
function ensureIndState(){if(!indState)indState=indDefault();}
function indKeyFrom(){return indState.fromY+'-'+String(indState.fromM).padStart(2,'0');}
function indKeyTo(){return indState.toY+'-'+String(indState.toM).padStart(2,'0');}
function indInRange(c){var ym=ymOf(indDate(c));if(!ym)return false;return ym>=indKeyFrom()&&ym<=indKeyTo();}
function indFiltered(){var os=indState.obras,has=Object.keys(os).length>0;return CAPS.filter(function(c){if(has&&!os[c.obId])return false;return indInRange(c);});}
function indMonths(){var out=[],y=indState.fromY,m=indState.fromM,ty=indState.toY,tm=indState.toM,g=0;
  while((y<ty||(y===ty&&m<=tm))&&g<120){out.push({y:y,m:m,key:y+'-'+String(m).padStart(2,'0')});m++;if(m>12){m=1;y++;}g++;}return out;}
function indMonthLabel(mo){return MESES[mo.m-1].charAt(0).toUpperCase()+MESES[mo.m-1].slice(1,3)+" '"+String(mo.y).slice(2);}
function indPeriodLabel(){function c1(s){return s.charAt(0).toUpperCase()+s.slice(1);}return c1(MESES[indState.fromM-1])+' '+indState.fromY+'  a  '+c1(MESES[indState.toM-1])+' '+indState.toY;}
function indScopeLabel(){var ks=Object.keys(indState.obras);if(!ks.length)return 'Todos los centros de trabajo';return OBRAS.filter(function(o){return indState.obras[o.id];}).map(function(o){return o.nombre;}).join(', ');}

function selMonthYear(prefix){var mo='',yr='',yrs=[2024,2025,2026,2027];
  for(var i=0;i<12;i++){var nm=MESES[i].charAt(0).toUpperCase()+MESES[i].slice(1);mo+='<option value="'+(i+1)+'"'+((i+1)===indState[prefix+'M']?' selected':'')+'>'+nm+'</option>';}
  for(var j=0;j<yrs.length;j++){yr+='<option value="'+yrs[j]+'"'+(yrs[j]===indState[prefix+'Y']?' selected':'')+'>'+yrs[j]+'</option>';}
  return '<select data-ind="'+prefix+'M">'+mo+'</select><select data-ind="'+prefix+'Y">'+yr+'</select>';}
function obraChips(){var none=Object.keys(indState.obras).length===0;
  var chips='<button class="indchip'+(none?' on':'')+'" data-ind-obra="__all">Todos</button>';
  chips+=OBRAS.map(function(o){var on=!!indState.obras[o.id];return '<button class="indchip'+(on?' on':'')+'" data-ind-obra="'+o.id+'"><span class="indchip-dot" style="background:'+o.color+'"></span>'+esc(o.nombre)+'</button>';}).join('');
  return chips;}

  var evN=0,evSum=0;caps.forEach(function(c){evalsFor(c.id).forEach(function(e){evSum+=e.rating;evN++;});});
  var rating=evN?(evSum/evN):0;
  var horasDict=0;caps.forEach(function(c){if(c.estado==='ejecutada')horasDict+=(c.dur||0);});horasDict=Math.round(horasDict/60*10)/10;
  document.getElementById('crumb').textContent='Indicadores';

  document.getElementById('content').innerHTML=
    indFilterBar()+
    '<div class="kpi-grid ind-kpis">'+

      kpi('Capacitaciones',String(k.total),k.ejec+' ejecutadas \u00b7 '+(k.total-k.ejec)+' pendientes','cal','var(--blue-soft)','var(--blue)')+
      kpi('Asistencias',String(k.pers),(k.h+k.f>0?k.h+' H \u00b7 '+k.f+' M':'registradas'),'users','var(--green-soft)','var(--green)')+
      kpi('Horas-hombre',String(k.horasHombre),'de formaci\u00f3n','clock','var(--purple-soft)','var(--purple)')+
      kpi('Horas dictadas',String(horasDict),'suma de duraciones','clock','var(--gold-soft)','var(--gold-deep)')+
      kpi('Calificaci\u00f3n',(evN?rating.toFixed(1):'\u2014'),(evN?evN+' evaluaciones':'sin evaluaciones a\u00fan'),'star','var(--gold-soft)','var(--gold-deep)')+
      kpi('Vencidas',String(k.venc),k.venc?'requieren reprogramar':'todo al d\u00eda','alert',k.venc?'var(--red-soft)':'var(--green-soft)',k.venc?'var(--red)':'var(--green)')+
    '</div>'+

function drawIndCharts(caps){
  if(typeof Chart==='undefined')return;
  var months=indMonths(),ml=months.map(indMonthLabel);
  var ejecM=months.map(function(mo){return caps.filter(function(c){return c.estado==='ejecutada'&&ymOf(indDate(c))===mo.key;}).length;});
  var planM=months.map(function(mo){return caps.filter(function(c){return c.estado!=='ejecutada'&&ymOf(indDate(c))===mo.key;}).length;});
  var asistM=months.map(function(mo){var s=0;caps.forEach(function(c){if(c.estado==='ejecutada'&&ymOf(indDate(c))===mo.key)s+=attData(c).nAsist;});return s;});
  var horasM=months.map(function(mo){var s=0;caps.forEach(function(c){if(c.estado==='ejecutada'&&ymOf(indDate(c))===mo.key)s+=(c.dur||0)*attData(c).nAsist;});return Math.round(s/60);});
  var obrasIn=OBRAS.filter(function(o){return caps.some(function(c){return c.obId===o.id;});});
  var obN=obrasIn.map(function(o){return o.nombre;});
  var obE=obrasIn.map(function(o){return caps.filter(function(c){return c.obId===o.id&&c.estado==='ejecutada';}).length;});
  var obP=obrasIn.map(function(o){return caps.filter(function(c){return c.obId===o.id&&c.estado!=='ejecutada';}).length;});
  var obC=obrasIn.map(function(o){var a=caps.filter(function(c){return c.obId===o.id&&c.estado==='ejecutada';});if(!a.length)return 0;var s=0;a.forEach(function(c){s+=attData(c).cob;});return Math.round(s/a.length);});
  var nEjec=caps.filter(function(c){return c.estado==='ejecutada';}).length;
  var nVenc=caps.filter(function(c){return estadoReal(c)==='late';}).length;
  var nPend=Math.max(0,caps.length-nEjec-nVenc);
  var nOblig=caps.filter(function(c){return c.tipo==='obligatoria';}).length;
  var nNec=Math.max(0,caps.length-nOblig);
  var aMap={};caps.forEach(function(c){aMap[c.deId]=(aMap[c.deId]||0)+1;});
  var aIds=Object.keys(aMap).sort(function(a,b){return aMap[b]-aMap[a];});
  var aN=aIds.map(function(id){var d=deptById(id);return d?d.nombre:id;}),aV=aIds.map(function(id){return aMap[id];});
  var tmap={};caps.forEach(function(c){var key=crKey(c.resp);if(!key)return;var disp=normResp(c.resp);if(disp==='\u2014')return;if(!tmap[key])tmap[key]={nombre:disp,min:0,sum:0,n:0};if(c.estado==='ejecutada')tmap[key].min+=(c.dur||0);evalsFor(c.id).forEach(function(e){tmap[key].sum+=e.rating;tmap[key].n++;});});
  var tk=Object.keys(tmap);
  var tByH=tk.slice().sort(function(a,b){return tmap[b].min-tmap[a].min;}).slice(0,10);
  var trN=tByH.map(function(k){return tmap[k].nombre;}),trH=tByH.map(function(k){return Math.round(tmap[k].min/60*10)/10;});
  var tR=tk.filter(function(k){return tmap[k].n>0;}).sort(function(a,b){return (tmap[b].sum/tmap[b].n)-(tmap[a].sum/tmap[a].n);}).slice(0,10);
  var raN=tR.map(function(k){return tmap[k].nombre;}),raV=tR.map(function(k){return Math.round(tmap[k].sum/tmap[k].n*10)/10;});
  function mk(id,cfg){var el=document.getElementById(id);if(el)charts[id]=new Chart(el,cfg);}
  var baseY={beginAtZero:true,ticks:{precision:0},grid:{color:'rgba(0,0,0,.05)'}};
  mk('chIndScope',{type:'bar',data:{labels:obN,datasets:[{label:'Ejecutadas',data:obE,backgroundColor:'#2E7D52',borderRadius:5},{label:'Planificadas',data:obP,backgroundColor:'#D9A441',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false}},y:baseY}}});
  mk('chIndEstado',{type:'doughnut',data:{labels:['Ejecutadas','Pendientes','Vencidas'],datasets:[{data:[nEjec,nPend,nVenc],backgroundColor:['#2E7D52','#D9A441','#C0392B'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
  mk('chIndMes',{type:'bar',data:{labels:ml,datasets:[{type:'bar',label:'Ejecutadas',data:ejecM,backgroundColor:'#B8791A',borderRadius:5,order:2},{type:'line',label:'Planificadas',data:planM,borderColor:'#2F6FB0',backgroundColor:'rgba(47,111,176,.15)',tension:.35,fill:true,order:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false}},y:baseY}}});
  mk('chIndTipo',{type:'doughnut',data:{labels:['Obligatoria por ley','Por necesidades identificadas'],datasets:[{data:[nOblig,nNec],backgroundColor:['#8A6E6E','#4A7BA6'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}});
  mk('chIndArea',{type:'bar',data:{labels:aN,datasets:[{label:'Capacitaciones',data:aV,backgroundColor:aN.map(function(_,i){return IND_COLORS[i%IND_COLORS.length];}),borderRadius:5}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0},grid:{color:'rgba(0,0,0,.05)'}},y:{grid:{display:false}}}}});
  mk('chIndAsist',{type:'bar',data:{labels:ml,datasets:[{label:'Asistencias',data:asistM,backgroundColor:'#2E7D52',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'}}}}});
  mk('chIndHoras',{type:'line',data:{labels:ml,datasets:[{label:'Horas-hombre',data:horasM,borderColor:'#7A5AB0',backgroundColor:'rgba(122,90,176,.15)',tension:.35,fill:true,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'}}}}});
  mk('chIndTrainer',{type:'bar',data:{labels:trN,datasets:[{label:'Horas dictadas',data:trH,backgroundColor:'#B8791A',borderRadius:5}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'}},y:{grid:{display:false}}}}});
  mk('chIndRating',{type:'bar',data:{labels:raN,datasets:[{label:'Calificaci\u00f3n',data:raV,backgroundColor:'#D9A441',borderRadius:5}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.parsed.x+' / 5';}}}},scales:{x:{beginAtZero:true,max:5,grid:{color:'rgba(0,0,0,.05)'}},y:{grid:{display:false}}}}});
  mk('chIndCob',{type:'bar',data:{labels:obN,datasets:[{label:'Cobertura',data:obC,backgroundColor:'#2F6FB0',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.parsed.y+'%';}}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,max:100,grid:{color:'rgba(0,0,0,.05)'}}}}});
}

function repKpi(v,l){return '<div class="rep-kpi"><div style="font-family:Fraunces,serif;font-size:25px;color:#B8791A">'+v+'</div><div style="font-size:11.5px;color:#8a827a;margin-top:2px">'+l+'</div></div>';}
function buildIndReport(){
  var caps=indFiltered();var k=kpisScope(caps);
  var evN=0,evSum=0;caps.forEach(function(c){evalsFor(c.id).forEach(function(e){evSum+=e.rating;evN++;});});var rating=evN?(evSum/evN):0;
  var horasDict=0;caps.forEach(function(c){if(c.estado==='ejecutada')horasDict+=(c.dur||0);});horasDict=Math.round(horasDict/60*10)/10;
  var obrasIn=OBRAS.filter(function(o){return caps.some(function(c){return c.obId===o.id;});});
  var scopeBars=obrasIn.map(function(o,i){return {label:o.nombre,value:caps.filter(function(c){return c.obId===o.id&&c.estado==='ejecutada';}).length,color:IND_COLORS[i%IND_COLORS.length]};});
  var aMap={};caps.forEach(function(c){aMap[c.deId]=(aMap[c.deId]||0)+1;});
  var areaBars=Object.keys(aMap).sort(function(a,b){return aMap[b]-aMap[a];}).map(function(id,i){var d=deptById(id);return {label:d?d.nombre:id,value:aMap[id],color:IND_COLORS[i%IND_COLORS.length]};});
  var nOblig=caps.filter(function(c){return c.tipo==='obligatoria';}).length;
  var tipoBars=[{label:'Obligatoria por ley',value:nOblig,color:'#8A6E6E'},{label:'Por necesidades identificadas',value:Math.max(0,caps.length-nOblig),color:'#4A7BA6'}];
  var tmap={};caps.forEach(function(c){var key=crKey(c.resp);if(!key)return;var disp=normResp(c.resp);if(disp==='\u2014')return;if(!tmap[key])tmap[key]={nombre:disp,min:0};if(c.estado==='ejecutada')tmap[key].min+=(c.dur||0);});
  var trainerBars=Object.keys(tmap).sort(function(a,b){return tmap[b].min-tmap[a].min;}).slice(0,12).map(function(key,i){return {label:tmap[key].nombre,value:Math.round(tmap[key].min/60*10)/10,color:IND_COLORS[i%IND_COLORS.length]};});
  return '<div class="rep-page">'+
    '<div class="rep-mark"></div>'+
    '<div class="rep-brandline">Informe ejecutivo de capacitaciones</div>'+
    '<div class="rep-kicker">ETINAR S.A. \u00b7 Seguridad y Salud en el Trabajo</div>'+
    '<div class="rep-cover-meta"><div><b>Per\u00edodo</b><br>'+indPeriodLabel()+'</div><div><b>Alcance</b><br>'+esc(indScopeLabel())+'</div><div><b>Generado</b><br>'+fmtFecha(iso(HOY))+'</div></div>'+
    '<div style="height:24px"></div>'+
    '<div class="rep-kpis" style="grid-template-columns:repeat(4,1fr)">'+repKpi(k.pct+'%','Cumplimiento')+repKpi(k.total,'Capacitaciones')+repKpi(k.ejec,'Ejecutadas')+repKpi(k.pers,'Asistencias')+repKpi(k.horasHombre,'Horas-hombre')+repKpi(horasDict,'Horas dictadas')+repKpi(evN?rating.toFixed(1):'\u2014','Calificaci\u00f3n')+repKpi(k.venc,'Vencidas')+'</div>'+
    '<div class="rep-chart" style="text-align:left"><h3 style="font-size:14px;margin:0 0 12px;color:#423D3B">Cumplimiento por centro de trabajo (ejecutadas)</h3>'+repHBars(scopeBars)+'</div>'+
    '<div class="rep-chart" style="text-align:left"><h3 style="font-size:14px;margin:0 0 12px;color:#423D3B">Distribuci\u00f3n por tipo</h3>'+repHBars(tipoBars)+'</div>'+
    '<div class="rep-chart" style="text-align:left"><h3 style="font-size:14px;margin:0 0 12px;color:#423D3B">Por \u00e1rea de capacitaci\u00f3n</h3>'+repHBars(areaBars)+'</div>'+
    '<div class="rep-chart" style="text-align:left"><h3 style="font-size:14px;margin:0 0 12px;color:#423D3B">Ranking de capacitadores (horas dictadas)</h3>'+repHBars(trainerBars)+'</div>'+
    '<div class="rep-note">Marco normativo referencial: Decreto Ejecutivo No. 255 y dem\u00e1s normativa aplicable. Documento generado autom\u00e1ticamente por la plataforma de capacitaciones ETINAR; validar con el \u00e1rea de SST.</div>'+
  '</div>';
}

var SUC_MAP={"ADMINISTRACION": "ob07", "AGORA CENTRO DE ESPECIALIDADES": "ob11", "AGORA CENTRO DE ESPECIALIDADES ADMINISTRACION": "ob11", "AGORA CITY PARK - PARK VIEW 1": "ob15", "AGORA CIUDAD MEDICA": "ob11", "BELLATERRA": "ob09", "EDIFICIO MANTA": "ob05", "GALERIAS TERRANOSTRA": "ob09", "GRAND BAY": "ob05", "GRAND BAY 2": "ob05", "GRAND BAY 3": "ob05", "GRANOLLERS ETINAR": "ob09", "HIPERMARKET SANTO DOMINGO": "ob08", "HOSPITAL CAMPANA": "ob03", "MILLENIUM PARK 1 BOMPA": "ob04", "MILLENIUM PARK 3 PARK RESIDENCES": "ob01", "TERRANOSTRA MANTENIMIENTO PLAN MAESTRO": "ob09", "TITANIUM 2": "ob06", "TORRE MAXXIMUS": "ob02", "SOLCA MACHALA": "ob23", "HOSPITAL MILLENIUM MED": "ob03"};
var DEP_MAP={"MARKETING": "de10", "MANO DE OBRA": "de01", "LEGAL": "de11", "TECNICO": "de02", "CREDITOS Y COBRANZAS": "de07", "COMERCIAL": "de03", "TALENTO HUMANO": "de04", "CONTABILIDAD": "de08", "ARQUITECTURA": "de09", "MENSAJERIA Y LIMPIEZA": "de12", "SERVICIOS GENERALES": "de05", "TECNICO DE OBRAS": "de13", "ADMINISTRACION": "de06", "FINANCIERO": "de14", "GERENCIA GENERAL": "de18", "PRESUPUESTO": "de15", "PRESIDENCIA": "de16", "SISTEMAS": "de17"};
var pendingImport=null;
function normTxt(s){return (s==null?'':(''+s)).replace(/\s+/g,' ').trim().toUpperCase();}
function normSexo(s){var t=normTxt(s);if(t.charAt(0)==='F')return 'F';if(t.charAt(0)==='M')return 'M';return 'M';}
function obName(id){var o=obraById(id);return o?o.nombre:id;}
function writeRosterLocal(){try{localStorage.setItem('etinar_roster',JSON.stringify(EMPLEADOS));}catch(e){}}
async function saveRoster(){writeRosterLocal();if(SB&&SB_OK){try{await SB.from('config').upsert({id:'empleados',data:{empleados:EMPLEADOS},updated_at:new Date().toISOString()});}catch(e){console.warn('saveRoster remote',e);toast('Se guard\u00f3 en este equipo, pero no en la nube. Ejecuta configurar_empleados.sql en Supabase.','alert');}}}
async function loadRosterRemote(){if(!(SB&&SB_OK))return;try{var r=await SB.from('config').select('data').eq('id','empleados').maybeSingle();if(r&&r.data&&r.data.data&&r.data.data.empleados&&r.data.data.empleados.length){EMPLEADOS=r.data.data.empleados;}}catch(e){console.warn('loadRoster',e);}}
function empFileChosen(input){var f=input&&input.files&&input.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(ev){try{var data=new Uint8Array(ev.target.result);var wb=XLSX.read(data,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});parseEmpRows(rows);}catch(e){console.warn('excel parse',e);toast('No se pudo leer el Excel. Revisa que sea el archivo correcto.','alert');}};reader.onerror=function(){toast('No se pudo abrir el archivo.','alert');};reader.readAsArrayBuffer(f);input.value='';}
function parseEmpRows(rows){var hIdx=-1,cols={};for(var i=0;i<rows.length&&i<30;i++){var r=rows[i];if(!r)continue;for(var j=0;j<r.length;j++){if(normTxt(r[j])==='CEDULA'){hIdx=i;break;}}if(hIdx>=0){var hr=rows[hIdx];for(var k=0;k<hr.length;k++){cols[normTxt(hr[k])]=k;}break;}}
  if(hIdx<0){toast('No encontr\u00e9 la columna CEDULA en el Excel.','alert');return;}
  var cCed=cols['CEDULA'],cNom=(cols['EMPLEADO']!=null?cols['EMPLEADO']:cols['NOMBRE']),cSuc=cols['SUCURSAL'],cCargo=cols['CARGO'],cDep=cols['DEPARTAMENTO'],cSexo=cols['SEXO'];
  if(cCed==null){toast('No encontr\u00e9 la columna CEDULA en el Excel.','alert');return;}
  var roster=[],seen={},omitCeds={},omitSuc={},omitNames=[];
  for(var t=hIdx+1;t<rows.length;t++){var row=rows[t];if(!row)continue;
    var ced=(''+(row[cCed]!=null?row[cCed]:'')).replace(/[^0-9]/g,'').trim();if(!ced)continue;
    if(seen[ced])continue;seen[ced]=1;
    var nom=(cNom!=null?(''+row[cNom]):'').replace(/\s+/g,' ').trim();
    var sucKey=normTxt(cSuc!=null?row[cSuc]:'');var obId=SUC_MAP[sucKey];
    if(!obId){omitCeds[ced]=1;omitSuc[sucKey||'(sin sucursal)']=1;omitNames.push(nom||ced);continue;}
    var deId=DEP_MAP[normTxt(cDep!=null?row[cDep]:'')]||'de01';
    var sexo=normSexo(cSexo!=null?row[cSexo]:'');
    var cargo=(cCargo!=null?(''+row[cCargo]):'').replace(/\s+/g,' ').trim()||'\u2014';
    roster.push({ced:ced,nom:nom||ced,obId:obId,deId:deId,sexo:sexo,cargo:cargo});}
  if(!roster.length&&!omitNames.length){toast('El Excel no ten\u00eda filas de empleados debajo de la cabecera.','alert');return;}
  pendingImport={roster:roster,omittedCeds:omitCeds,omittedSuc:Object.keys(omitSuc),omittedNames:omitNames};
  showEmpPreview();}
function empDiff(){var cur={};EMPLEADOS.forEach(function(e){cur[e.ced]=e;});var neu={};pendingImport.roster.forEach(function(e){neu[e.ced]=e;});
  var add=[],move=[],same=0;pendingImport.roster.forEach(function(n){var c=cur[n.ced];if(!c){add.push(n);}else if(c.obId!==n.obId){move.push({e:c,from:c.obId,to:n.obId});}else{same++;}});
  var remove=[];EMPLEADOS.forEach(function(e){if(!neu[e.ced]&&!pendingImport.omittedCeds[e.ced])remove.push(e);});
  return {add:add,move:move,remove:remove,same:same};}
function empStat(n,label,color){return '<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center"><div style="font-family:Fraunces;font-size:26px;color:'+color+'">'+n+'</div><div style="font-size:11.5px;color:var(--muted2)">'+label+'</div></div>';}
function empList(title,color,items){if(!items.length)return '';return '<div style="margin-bottom:12px"><div style="font-weight:600;font-size:12.5px;color:'+color+';margin-bottom:6px">'+title+' ('+items.length+')</div><div style="border:1px solid var(--line);border-radius:10px;max-height:150px;overflow:auto">'+items.slice(0,300).map(function(t,i){return '<div style="padding:6px 10px;font-size:12.5px;'+(i%2?'background:var(--paper)':'')+'">'+t+'</div>';}).join('')+'</div></div>';}
function showEmpPreview(){var d=empDiff();var nCh=d.add.length+d.remove.length+d.move.length;
  var h='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">'+empStat(d.add.length,'a ingresar','var(--green)')+empStat(d.remove.length,'a eliminar','var(--red)')+empStat(d.move.length,'cambian de obra','var(--blue)')+empStat(d.same,'sin cambios','var(--muted2)')+'</div>';
  h+=empList('Nuevos \u2014 se ingresar\u00e1n','var(--green)',d.add.map(function(e){return esc(e.nom)+' \u2192 '+esc(obName(e.obId));}));
  h+=empList('Cambian de centro de trabajo','var(--blue)',d.move.map(function(m){return esc(m.e.nom)+': '+esc(obName(m.from))+' \u2192 '+esc(obName(m.to));}));
  h+=empList('Se eliminar\u00e1n \u2014 ya no est\u00e1n en el listado','var(--red)',d.remove.map(function(e){return esc(e.nom)+' \u00b7 '+esc(obName(e.obId));}));
  if(pendingImport.omittedNames.length){h+=empList('Omitidos \u2014 sucursal no reconocida (se conservan)','var(--gold-deep)',pendingImport.omittedNames.map(function(n){return esc(n);}));h+='<div style="font-size:12px;color:var(--muted2);margin:-4px 0 8px">Sucursales no reconocidas: <b>'+esc(pendingImport.omittedSuc.join(', '))+'</b>. Estas personas no se ingresan ni se eliminan; quedan igual. Si deben entrar, revisa que el Excel escriba la sucursal con un nombre que la plataforma ya conoce.</div>';}
  if(!nCh){h+='<div class="note-box">'+svg('check')+'<div>El listado ya coincide con la plataforma. No hay cambios que aplicar.</div></div>';}
  openModal('Actualizar listado de empleados','users',h,'<button class="btn" data-close="1">Cancelar</button>'+(nCh?'<button class="btn gold" data-apply-emp="1">'+svg('save','ic')+'Aplicar cambios ('+nCh+')</button>':''));}

function repStats(caps){
  var ejec=0,plan=0,asis=0,horas=0,cobSum=0,cobN=0,oblig=0,byDe={},byMes={};
  caps.forEach(function(c){var a=attData(c);
    if(c.estado==='ejecutada'){ejec++;asis+=a.nAsist;horas+=c.dur*a.nAsist;cobSum+=a.cob;cobN++;}else{plan++;}
    if(c.tipo==='obligatoria')oblig++;
    byDe[c.deId]=(byDe[c.deId]||0)+1;
    var ym=c.fecha.slice(0,7);byMes[ym]=byMes[ym]||{e:0,p:0,a:0};
    if(c.estado==='ejecutada'){byMes[ym].e++;byMes[ym].a+=a.nAsist;}else{byMes[ym].p++;}});
  return {total:caps.length,ejec:ejec,plan:plan,asis:asis,horas:Math.round(horas/60),
    pct:caps.length?Math.round(ejec/caps.length*100):0,cob:cobN?Math.round(cobSum/cobN):0,oblig:oblig,byDe:byDe,byMes:byMes};
}

function repBars(data,color){var max=1;data.forEach(function(d){if(d.value>max)max=d.value;});
  var W=720,H=210,pad=26,n=data.length||1,bw=(W-pad*2)/n,out='';
  data.forEach(function(d,i){var h=Math.round(d.value/max*(H-56));var x=pad+i*bw;var y=H-28-h;
    out+='<rect x="'+(x+bw*0.2).toFixed(1)+'" y="'+y+'" width="'+(bw*0.6).toFixed(1)+'" height="'+h+'" rx="3" fill="'+color+'"/>';
    if(d.value)out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10" fill="#5b544e">'+d.value+'</text>';
    out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5" fill="#8a827a">'+d.label+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+out+'</svg>';
}
function repHBars(data){var max=1;data.forEach(function(d){if(d.value>max)max=d.value;});var out='';

var SB=null, SB_OK=false, BUCKET='evidencias', saveTimers={}, pendientes={}, savingNow=false, EVALS=[], retryTimer=null;
var PEND_KEY='etinar_caps_pendientes';
function readPend(){try{return JSON.parse(localStorage.getItem(PEND_KEY)||'{}');}catch(e){return {};}}
function writePend(){try{var o={};Object.keys(pendientes).forEach(function(id){var c=cap(id);if(c)o[id]=c;});if(Object.keys(o).length)localStorage.setItem(PEND_KEY,JSON.stringify(o));else localStorage.removeItem(PEND_KEY);}catch(e){}}
function initSupabase(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase){
    try{SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(err){console.warn('Supabase no inicializo:',err);SB=null;}
  }
  var stored=readPend();Object.keys(stored).forEach(function(id){pendientes[id]=1;var i=CAPS.findIndex(function(c){return c.id===id;});if(i>=0)CAPS[i]=stored[id];else CAPS.push(stored[id]);});
  setSaveStatus();
}
async function fetchAllCaps(){
  var all=[],from=0,size=1000;
  while(true){
    var res=await SB.from('capacitaciones').select('id,data').order('id').range(from,from+size-1);
    if(res.error)throw res.error;
    var rows=res.data||[]; all=all.concat(rows);
    if(rows.length<size)break; from+=size;
  }
  return all;
}
async function loadEvals(){ if(!SB)return; try{var res=await SB.from('evaluaciones').select('cap_id,rating,comentario,created_at,cedula,primer_nombre,segundo_nombre,primer_apellido,segundo_apellido');if(!res.error)EVALS=res.data||[];}catch(e){console.warn('evals',e);} }
async function loadRemote(){
  if(!SB)return;
  try{
    var rows=await fetchAllCaps();
    SB_OK=true;
    CAPS=rows.map(function(r){return r.data;});
    var stored=readPend();Object.keys(pendientes).forEach(function(id){var c=stored[id];if(c){var i=CAPS.findIndex(function(x){return x.id===id;});if(i>=0)CAPS[i]=c;else CAPS.push(c);}});
    await loadEvals();
    await loadRosterRemote();
    setSaveStatus(); toast('Conectado a Supabase ('+CAPS.length+' capacitaciones)','db');
    if(Object.keys(pendientes).length)flushPendientes();
  }catch(err){
    SB_OK=false;console.warn('Supabase load error:',err);
    toast('No se pudo conectar a Supabase. Revisa las claves y el SQL.','alert'); setSaveStatus();
  }
}
function queueSaveCap(id){
  pendientes[id]=1; writePend(); setSaveStatus();
  clearTimeout(saveTimers[id]);
  saveTimers[id]=setTimeout(function(){flushPendientes();},700);
}
async function flushPendientes(){
  if(savingNow)return;
  if(!SB){setSaveStatus();return;}
  var ids=Object.keys(pendientes); if(!ids.length){setSaveStatus();return;}
  savingNow=true; setSaveStatus();
  for(var i=0;i<ids.length;i++){ var ok=await saveCapRemote(ids[i]); if(ok){delete pendientes[ids[i]];} }
  savingNow=false; writePend();
  var left=Object.keys(pendientes).length; setSaveStatus();
  clearTimeout(retryTimer);
  if(left)retryTimer=setTimeout(flushPendientes,12000);
}
async function saveCapRemote(id){
  var c=cap(id); if(!c)return true;
  try{
    var res=await SB.from('capacitaciones').upsert({id:c.id,data:c,updated_at:new Date().toISOString()});

    SB_OK=true; return true;
  }catch(err){console.warn('save error',err); if(!navigator.onLine)SB_OK=false; return false;}
}

function safeName(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_');}
async function uploadToStorage(capId,tipo,file){
  var path=capId+'/'+tipo+'/'+Date.now()+'_'+safeName(file.name);
  var up=await SB.storage.from(BUCKET).upload(path,file,{upsert:false});
  if(up.error)throw up.error;

}

/* ===== Estrellas y calificaciones ===== */
function starSVG(){return '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';}
function starsHTML(avg){var s='<span class="stars">';for(var i=1;i<=5;i++){s+='<span class="'+(i<=Math.round(avg)?'star-on':'star-off')+'">'+starSVG()+'</span>';}return s+'</span>';}
function evalsFor(capId){return EVALS.filter(function(e){return e.cap_id===capId;});}
function ratingOf(capId){var es=evalsFor(capId);if(!es.length)return {avg:0,count:0};var sum=0;es.forEach(function(e){sum+=e.rating;});return {avg:sum/es.length,count:es.length};}
function crKey(s){return (s||'').trim().replace(/\s+/g,' ').toLowerCase();}
function normResp(s){return (s||'').trim().replace(/\s+/g,' ');}
function capsByTrainer(key){return CAPS.filter(function(c){return crKey(c.resp)===key;});}
function trainerRating(name){var caps=capsByTrainer(name),sum=0,n=0;caps.forEach(function(c){evalsFor(c.id).forEach(function(e){sum+=e.rating;n++;});});return {avg:n?sum/n:0,count:n};}
function capacitadores(){
  var map={};
  CAPS.forEach(function(c){var key=crKey(c.resp);if(!key)return;var disp=normResp(c.resp);if(disp==='\u2014')return;if(!map[key])map[key]={key:key,nombre:disp,caps:[],min:0,ejec:0,areas:{}};
    map[key].caps.push(c); if(c.estado==='ejecutada'){map[key].ejec++;map[key].min+=(c.dur||0);} map[key].areas[c.deId]=1;});
  var arr=Object.keys(map).map(function(k){var t=map[k],rt=trainerRating(k);
    return {key:t.key,nombre:t.nombre,nCaps:t.caps.length,ejec:t.ejec,horas:Math.round(t.min/60*10)/10,areas:Object.keys(t.areas),rating:rt.avg,nRating:rt.count,caps:t.caps};});
  arr.sort(function(a,b){return b.horas-a.horas;}); return arr;
}

  var head='<div class="survey-brand"><div class="mark"></div><div class="word">ETINAR</div></div>';
  if(surveyState.sent){sv.innerHTML='<div class="survey-wrap"><div class="survey-card">'+head+'<div class="survey-thanks"><div class="big-check">'+svg('check')+'</div><h1 style="text-align:center">\u00a1Gracias por tu evaluaci\u00f3n!</h1><p style="color:var(--muted);text-align:center;margin:0">Tu opini\u00f3n ayuda a mejorar las capacitaciones.</p></div></div></div>';return;}
  if(!c){sv.innerHTML='<div class="survey-wrap"><div class="survey-card">'+head+'<h1>Capacitaci\u00f3n no encontrada</h1><p class="survey-meta">El enlace no corresponde a una capacitaci\u00f3n registrada.</p></div></div>';return;}
  var o=obraById(c.obId);var labels=['','Muy insatisfecho','Insatisfecho','Aceptable','Satisfecho','Excelente'];
  var stars='';for(var i=1;i<=5;i++){stars+='<button class="'+(i<=surveyState.rating?'on':'')+'" data-rate="'+i+'">'+starSVG()+'</button>';}
  sv.innerHTML='<div class="survey-wrap"><div class="survey-card">'+head+
    '<h1>'+esc(c.nombre)+'</h1>'+
    '<div class="survey-meta">Capacitador: <b>'+esc(c.resp||'\u2014')+'</b><br>'+(o?esc(o.nombre)+' \u00b7 ':'')+fmtFecha(c.fecha)+'</div>'+
    '<div class="survey-q">Tus datos <span style="font-weight:400;color:var(--muted);font-size:12.5px">(para registrar tu asistencia)</span></div>'+
    '<input id="ev-ced" inputmode="numeric" placeholder="C\u00e9dula *" value="'+esc(surveyState.ced||'')+'" style="padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;box-sizing:border-box;width:100%;margin-bottom:8px">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:2px">'+
      '<input id="ev-pn" placeholder="Primer nombre *" value="'+esc(surveyState.pn||'')+'" style="padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;box-sizing:border-box;width:100%">'+
      '<input id="ev-sn" placeholder="Segundo nombre" value="'+esc(surveyState.sn||'')+'" style="padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;box-sizing:border-box;width:100%">'+
      '<input id="ev-pa" placeholder="Primer apellido *" value="'+esc(surveyState.pa||'')+'" style="padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;box-sizing:border-box;width:100%">'+
      '<input id="ev-sa" placeholder="Segundo apellido" value="'+esc(surveyState.sa||'')+'" style="padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;box-sizing:border-box;width:100%">'+
    '</div>'+
    '<div class="survey-q">\u00bfC\u00f3mo calificar\u00edas esta capacitaci\u00f3n?</div>'+
    '<div class="big-stars">'+stars+'</div>'+
    '<div class="rate-label">'+(surveyState.rating?labels[surveyState.rating]:'Toca una estrella')+'</div>'+
    '<div class="survey-q">Comentario (opcional)</div>'+
    '<textarea id="evalComment" placeholder="\u00bfQu\u00e9 te pareci\u00f3? \u00bfQu\u00e9 podr\u00eda mejorar?">'+esc(surveyState.comment||'')+'</textarea>'+
    '<button class="survey-send" data-send-eval="1"'+(surveyState.rating?'':' disabled')+'>'+(surveyState.sending?'Enviando\u2026':'Enviar evaluaci\u00f3n')+'</button>'+
  '</div></div>';
}
async function submitEval(){
  if(surveyState.sending)return;
  surveyState.comment=val('evalComment')||surveyState.comment;
  surveyState.ced=(val('ev-ced')||surveyState.ced||'').trim();
  surveyState.pn=(val('ev-pn')||surveyState.pn||'').trim();
  surveyState.sn=(val('ev-sn')||surveyState.sn||'').trim();
  surveyState.pa=(val('ev-pa')||surveyState.pa||'').trim();
  surveyState.sa=(val('ev-sa')||surveyState.sa||'').trim();
  if(!surveyState.ced){toast('Escribe tu c\u00e9dula','alert');return;}
  if(!surveyState.pn||!surveyState.pa){toast('Escribe al menos tu primer nombre y primer apellido','alert');return;}
  if(!surveyState.rating){toast('Elige una calificaci\u00f3n de 1 a 5 estrellas','alert');return;}
  surveyState.sending=true;renderSurvey();
  if(!SB&&window.supabase)initSupabase();
  if(SB){try{var res=await SB.from('evaluaciones').insert({cap_id:surveyState.capId,rating:surveyState.rating,comentario:surveyState.comment||null,cedula:surveyState.ced,primer_nombre:surveyState.pn,segundo_nombre:surveyState.sn||null,primer_apellido:surveyState.pa,segundo_apellido:surveyState.sa||null});if(res.error)throw res.error;
    surveyState.sent=true;surveyState.sending=false;renderSurvey();return;}
    catch(e){console.warn('eval error',e);surveyState.sending=false;renderSurvey();toast('No se pudo enviar. Revisa tu conexi\u00f3n.','alert');return;}}
  surveyState.sent=true;surveyState.sending=false;renderSurvey();
}
function openNav(){document.getElementById('app').classList.remove('nav-collapsed');}
function closeNav(){document.getElementById('app').classList.add('nav-collapsed');}
function toggleNav(){document.getElementById('app').classList.toggle('nav-collapsed');}
function closeSidebar(){if(window.innerWidth<=860)closeNav();}
document.getElementById('navOpen').addEventListener('click',openNav);
document.getElementById('navClose').addEventListener('click',closeNav);
document.getElementById('scrim').addEventListener('click',closeNav);
async function login(){document.getElementById('login').style.display='none';document.getElementById('app').classList.add('on');state.view='dashboard';route();if(SB){await loadRemote();route();}}
document.getElementById('li-btn').addEventListener('click',login);
document.getElementById('li-pass').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
if(window.innerWidth<=860)document.getElementById('app').classList.add('nav-collapsed');
window.addEventListener('online',function(){toast('Conexi\u00f3n restablecida \u2014 guardando pendientes','db');flushPendientes();});
window.addEventListener('offline',function(){toast('Sin conexi\u00f3n \u2014 los cambios quedar\u00e1n pendientes','alert');setSaveStatus();});
window.addEventListener('beforeunload',function(e){ if(Object.keys(pendientes).length){e.preventDefault();e.returnValue='Tienes cambios sin guardar. Si sales ahora podr\u00edan perderse.';} });
setInterval(function(){ if(Object.keys(pendientes).length&&!savingNow&&navigator.onLine)flushPendientes(); },15000);
handleSurveyRoute();
window.addEventListener('hashchange',handleSurveyRoute);
initSupabase();
</script>
